docker_playground:
  stage: test
  image: docker:latest
  tags:
    - compose
  variables:
    DOCKER_HOST: tcp://dockerdind:2375
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: docker:dind
      alias: dockerdind
  script:
    - echo "Starting playground stack..."
    - docker compose --profile e2e up playwright
  artifacts:
    when: always
    paths:
      - playwright-docker/
