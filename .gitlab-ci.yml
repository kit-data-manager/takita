  stage: build
  tags:
    - kgr1-instance-standard
## only needed for integration test - disabled for now  
#    - compose #run on gitlab runner suitable for docker
  rules:
  - if: '$CI_PIPELINE_SOURCE == "push"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd backend
    - ./gradlew clean build  --exclude-task integrationTest
  artifacts:
    paths:
      - ./backend/build/libs/*.jar

coverage:
  image: eclipse-temurin:21.0.10_7-jdk
  stage: test
  tags:
    - kgr1-instance-standard
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd backend
    - ./gradlew check jacocoTestReport --exclude-task integrationTest
    - ls -l
    - cat ./build/reports/jacoco/test/html/index.html
  artifacts:
    paths:
      - ./backend/build/reports/jacoco/test/*
  coverage: "/Total.*?([0-9]{1,3})%/"

