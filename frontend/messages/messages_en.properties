heading.error=Something went wrong!
heading.error_sub=Our Engineers try their best
text.helpPseudonym=The pseudonym is most importantly your identifier when editing annotations. You can also save your filter and dashboard settings and access them by logging in with your previous pseudonym. We recommend using a pseudonym with which your coworkers can identify you, for example your full name. It can be edited by clicking on the field 'edit' in the upper right hand corner. You can then type in your preferred pseudonym and when you're done you should click 'save' and you're logged in under the new pseudonym.
text.helpLanguage=Also in the upper right hand corner of the screen you can find the button language. If you want to change the language you need to click on the button to open the drop down menu and select the flag of your preferred language. When you have clicked on the flag the sites language should change.
text.helpColumns=Above the table there is the checkboxes "Always show thumbnails", which means with each new search or page change you can immediately see the thumbnails. This could lead to longer waiting periods. There are also the buttons "Choose columns", which lets you pick a selection of columns you would like to see in the table and saves them with the button "Apply", and "Reset columns", which resets the columns of the table to the standard configuration. You can also manually change which columns are shown and their order. The column with the buttons to open the editor is fixed as the first column and cannot be moved. All other columns have a button to the left of the column name which hides the column. You can also drag the columns to change their order.
text.helpSorting=Each column has a little arrow on the top right with which you can sort the list of results. If you click it multiple times the order of the results changes from ascending to descending and vice versa.
text.helpRows=For each result in the list, which represents one manuscript, there are different options on which you can click: The button in the first column opens the editor on the first page of the manuscript. Double clicking anywhere else on the row shows the thumbnails for this manuscript. With each thumbnail there is a button which opens the editor on the page of the thumbnail.
text.helpPages=Below the table you can see several buttons to change the page of the table or to see more results. There are buttons for the first, the previous, the next and the last page. There is also a selection of buttons to choose from one of the pages nearby. In the drop down menu the number of results per page can be selected. More results per page could lead to longer waiting periods.
text.helpSearch=The search bar is located at the top of the page. Here you can search for terms that appear anywhere within a manuscript, even inside a text card or annotation.
text.helpFilters=On the left hand side of the screen you can select filters you'd like to apply to the search results. In the drop down menu above you can select, which filters you'd like to add. With the add button next to the menu you confirm your choice. After that you can give each filter one or two values, according to how many fields there are. For the filters requiring from... to... values you can also leave one field empty and the filter will assume you want all results with values above or below the given threshold. If you've entered all values, click "Apply" to apply the filters. This will return all results that pass these filters in form of the table. For each filter you can delete it from your filter selection with the small "x" button on its top right corner, or you can clear all filters via the "Clear filters" button below. If you'd like to save your filters and the already entered values for the next use of the application simply check the "Save filter configuration" checkbox below and it will be accessible by entering the same pseudonym on the next use.
