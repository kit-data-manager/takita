<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>TEI Header Editor</title>
</head>
<body>
<div th:fragment="tei_header_editor">

    <table class="table table-borderless">
        <tbody class="table-light">
            <tr>
                <td width="10%"></td>
                <td width="20%" th:text="#{col_name.author}"></td>
                <td width="20%" th:text="${currentManuscript.teiAuthor} ? ${currentManuscript.authorListToString(currentManuscript.teiAuthor)} : 'UNKNOWN'"></td>
                <td width="10%"></td>
                <td width="20%" th:text="#{col_name.manuscriptCreationDate}"></td>
                <td width="20%" th:text="${currentManuscript.teiManuscriptCreationDate} ? ${currentManuscript.dateListToString(currentManuscript.teiManuscriptCreationDate)} : 'UNKNOWN'"></td>
            </tr>
            <tr th:if="${currentManuscript.teiTitle}">
                <td></td>
                <td th:text="#{col_name.title}"></td>
                <td th:text="${currentManuscript.titleListToString(currentManuscript.teiTitle)}"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr th:if="${currentManuscript.teiTitleSeries}">
                <td></td>
                <td th:text="#{col_name.title}"></td>
                <td th:text="${currentManuscript.titleListToString(currentManuscript.teiTitleSeries)}"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr  th:if="${currentManuscript.teiTitleMonographic}">
                <td></td>
                <td th:text="#{col_name.title}"></td>
                <td th:text="${currentManuscript.titleListToString(currentManuscript.teiTitleMonographic)}"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr th:if="${currentManuscript.teiTitleAnalytic}">
                <td></td>
                <td th:text="#{col_name.title}"></td>
                <td th:text="${currentManuscript.titleListToString(currentManuscript.teiTitleAnalytic)}"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
      </table>
</div>
</body>
</html>
