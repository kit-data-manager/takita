services:
  baserepo:
    hostname: baserepo
    image: ghcr.io/kit-data-manager/base-repo:latest
    ports:
      - :80
    environment:
      SPRING_APPLICATION_JSON: '{
        "server.port":80,
        "repo.messaging.enabled": true,
        "repo.messaging.username": "repo",
        "repo.messaging.password": "repo",
        "server.servlet.context-path": "/repo"
        }'
    networks:
      - compose-network
    healthcheck:
      test: "curl --fail --silent baserepo/repo/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 40s
