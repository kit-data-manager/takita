text.helpPseudonym=Das Pseudonym dient haupts\u00e4chlich zur Identifikation beim Erstellen oder Bearbeiten von Annotationen. Mithilfe des Pseudonyms werden au\u00c3\u009ferdem die Tabelleneinstellungen gespeichert und beim n\u00e4chsten Login wieder abgerufen. Wir empfehlen ein Pseudonym anhand welchem Ihre Kollegen Sie erkennen k\u00f6nnen, z.B. Ihren Vor- und Nachnamen. Nach dem Login kann das Pseudonym rechts oben bearbeitet werden, indem Sie auf den Editieren Knopf dr\u00fccken. Wenn Sie das neue Pseudonym eingegeben haben und mit "Speichern" best\u00e4tigen werden die Daten zu dem neuen Pseudonym geladen.
text.helpLanguage=Rechts oben k\u00f6nnen Sie die Sprache der Seite \u00e4ndern. Duch Klicken auf den Knopf "Sprache" \u00f6ffnet sich eine Auswahl an Sprachen, durch Klicken auf eine Sprache wird die Seite neu in der entsprechenden Sprache geladen. die Spracheinstellungen werden auch mit dem Pseudonym gespeichert.
text.helpColumns=\u00fcber der Tabelle gibt es ein H\u00e4kchen "Vorschaubilder immer anzeigen", wenn dieses gesetzt ist werden die Vorschaubilder immer alle angezeigt, dies f\u00fchrt eventuell zu l\u00e4ngeren Ladezeiten. Es gibt au\u00c3\u009ferdem den Knopf "Spalten ausw\u00e4hlen", unter diesem \u00f6ffnet sich ein Men\u00fc in welchem ausgew\u00e4hlt werden kann welche Spalten angezeigt werden sollen. Mit dem "Spalten zur\u00c3\u00bccksetzen" Knopf k\u00c3\u00b6nnen die Spalten wieder auf die Standardeinstellungen zur\u00fcckgesetzt werden. Spalten k\u00c3\u00b6nnen auch einzeln \u00c3\u00bcber die drei kleinen Punkte an jeder Spalte ausgeblendet werden. Au\u00c3\u009ferdem kann die Reihenfolge der Spalten duch Ziehen an die gew\u00fcnschte Stelle ver\u00e4ndert werden, wobei die Spalte, welche die Kn\u00f6pfe zum \u00f6ffnen des Editors beinhaltet, weder verschoben noch ausgeblendet werden kann. Die Spalte mit der ID kann ebenfalls nicht ausgeblendet werden.
text.helpSorting=Jede Spalte hat einen kleinen Pfeil oben, durch Klick auf diesen k\u00f6nnen die Ergebnisse entsprechend der Spalte auf oder absteigend sortiert werden. Erneutes Klicken auf den Pfeil dreht die Sortierung um.
text.helpRows=F\u00c3\u00bcr jedes Ergebnis in der Liste, welches ein Manuskript repr\u00e4sentiert gibt es weiter Optionen: \u00c3\u009cber den Knopf am Anfang der Zeile kann der Editor auf der ersten Seite des zugeh\u00f6rigen Manuskripts ge\u00f6ffnet werden. Durch einen Doppelklick auf einen anderen Teil der Reihe werden die Vorschaubilder zum Manuskript ausgeklappt. Hier befindet sich auch ein Knopf bei jedem Bild welches den Editor auf der entsprechenden Seite \u00f6ffnet. Ein erneuter Doppelklick auf die Reihe klappt die Vorschaubilder wieder ein.
text.helpPages=Unterhalb der Tabelle befinden sich Kn\u00f6pfe um die Seite zu \u00e4ndern. Au\u00c3\u009ferdem kann man die Anzahl der angezeigten Ergebnisse pro Seite ausw\u00e4hlen. Mehr Ergebnisse die gleichzeitig angezeigt werden f\u00c3\u00bchren eventuell zu h\u00c3\u00b6heren Ladezeiten.
text.helpSearch=Die Suchleiste befindet sich am oberen Rand. Hier k\u00f6nnen Sie vor allem auch nach Werten in Annotationen oder Textkarten suchen und bekommen die zugeh\u00f6rigen Manuskripte hierf\u00fcr als Ergebnisse angezeigt.
text.helpFilters=Auf der linken Seite befindet sich die Filterauswahl. Im Men\u00fc werden alle Filter ausgew\u00e4hlt die erstellt werden sollen, diese werden dann \u00fcber das Plus hinzugef\u00fcgt. Jetzt k\u00f6nnen Sie die gew\u00fcnschten Werte eintragen und die Filter mit dem Knopf anwenden. Bei einem von... bis.. Filter k\u00f6nnen Sie auch nur einen Wert eingeben, hier wird dann angenommen, dass nur Werte \u00fcber/unter dem angegebenen Wert gesucht sind. Jeder Filter kann einzeln \u00fcber den kleinen Knopf mit dem Kreuz entfernt werden oder es k\u00f6nnen alle Filter auf einmal \u00fcber den entsprechenden "Filter leeren" Knopf entfernt werden. Die angewendeten Filter werden auch mit dem Pseudonym gespeichert, so k\u00f6nnen Sie bei n\u00e4chsten Mal wieder genau dort weitermachen wo Sie aufgeh\u00f6rt haben und m\u00fcssen nicht alle Filter erneut konfigurieren.
