<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Header</title>
</head>
<body>
<div th:fragment="header" class="row justify-content-end">
    <div class="col-4 input-group">
        <input class="form-control"
               th:placeholder="#{label.pseudonym}"
               id="pseudonymInput"
               th:value="${user.getName()}"
               disabled>
        <div class="input-group-append">
            <button id="editButton"
                    class="btn btn-outline-secondary"
                    onclick="clickButton()"
                    th:text="#{buttons.edit}"> </button>
        </div>
    </div>
    <button class="col-auto btn btn-info" th:text="#{buttons.help}" onclick="getHelp()"> </button>
    <div class="dropdown col-auto">
        <button class="btn btn-info dropdown-toggle" type="button"  data-toggle="dropdown"
                aria-haspopup="true" aria-expanded="false" th:text="#{buttons.language}">
        </button>
        <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <a class="dropdown-item" href="?lang=de" th:text="#{language.de}"> </a>
            <a class="dropdown-item" href="?lang=en" th:text="#{language.gb}"> </a>
        </div>
    </div>


    <script th:inline="javascript">
        function getHelp(){
            location.href = '/assistance/help';
        }

        function clickButton(){
            /*<![CDATA[*/
            let button = document.getElementById('editButton');
            let input = document.getElementById('pseudonymInput');
            let edit = [[#{buttons.edit}]];
                let ok = [[#{buttons.ok}]];
            if (button.innerText === edit){
                button.innerText = ok;
                button.className = 'btn btn-info';
                input.disabled = false;
            }
            else {
                button.innerText = edit;
                button.className = 'btn btn-outline-secondary';
                input.disabled = true;
                setPseudonym();
            }
            /*]]>*/
        }

        function setPseudonym() {
            let input = $('#pseudonymInput').val();
            $.ajax({
                type: 'GET',
                url: 'assistance/' + input,
                dataType: 'text',
                success: function (responseData) {
                    location.href = '/';
                }
            });
        }
    </script>
</div>
</body>
</html>
