<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bootstrap core JavaScript -->
    <!-- CSS only -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous"
          th:href="@{https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css}">

    <!-- JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"
            th:src="@{https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js}"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
            integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"
            th:src="@{https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js}"></script>

    <!-- Font Awesome icons-->
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.18/dist/js/bootstrap-select.min.js"></script>

    <!-- Tabulator -->
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"
            integrity="sha384-Dziy8F2VlJQLMShA6FHWNul/veM9bCkRUaLqr199K94ntO5QUrLJBEbYegdSkkqX" crossorigin="anonymous"
            th:href="@{https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js}"></script>
    <link href="https://unpkg.com/tabulator-tables@4.7.1/dist/css/tabulator.min.css" rel="stylesheet"
          th:href="@{https://unpkg.com/tabulator-tables@4.7.1/dist/css/tabulator.min.css}">
    <link href="https://unpkg.com/tabulator-tables@4.7.1/dist/css/bootstrap/tabulator_bootstrap4.min.css"
          rel="stylesheet"
          th:href="@{https://unpkg.com/tabulator-tables@4.7.1/dist/css/bootstrap/tabulator_bootstrap4.min.css}">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.7.1/dist/js/tabulator.min.js"
            th:src="@{https://unpkg.com/tabulator-tables@4.7.1/dist/js/tabulator.min.js}"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.7.1/dist/js/jquery_wrapper.min.js"
            th:href="@{https://unpkg.com/tabulator-tables@4.7.1/dist/js/jquery_wrapper.min.js}"></script>
    <title th:text="#{label.tuhl}"> </title>
    <script th:src="@{js/main_page.js}"></script>
    <script>
        $(document).ready(function () {
            let visited = sessionStorage.getItem('visited');
            if (visited === null) {
                $('#pseudonymInputModal').modal('show');
            } else {
                $('#pseudonymInputModal').modal('hide');
            }


        });
    </script>

</head>
<body class="container-fluid p-0">
<div class="modal" tabindex="-1" role="dialog" id="pseudonymInputModal" data-backdrop="static">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{label.pseudonym}"> </h5>
            </div>
            <form onsubmit="enterPseudonym(event)">
                <div class="modal-body form-group">
                    <label for="pseudonymInitInput" th:text="#{prompt.pseudonym}"> </label>
                    <input type="text"
                           class="form-control"
                           id="pseudonymInitInput"
                           th:placeholder="#{label.pseudonym}"
                           required>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" th:text="#{buttons.submit}">
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


<div class="row mx-auto pr-3 bg-light">
    <div class="col-sm-5 col-md-4 col-lg-3 col-xl-2 p-6 align-self-center">
        <h1 class="text-center display-4" th:text="#{label.tuhl}"> </h1>
    </div>
    <div class="col-sm-4 p-6 my-1 align-self-center">
        <form onsubmit="setSearchTerm(event)">
            <div class="input-group">
                <input id="searchTerm"
                       type="text"
                       class="form-control"
                       th:placeholder="#{hint.search_term}"
                       th:if="${searchterm != null}"
                       th:value="${searchterm}">
                <input id="searchTermEmpty"
                       type="text"
                       class="form-control"
                       th:if="${searchterm == null}"
                       th:placeholder="#{hint.search_term}">
                <div class="input-group-append">
                    <button class="btn btn-outline-primary"
                            type="submit"
                            th:text="#{buttons.search}">
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm p-6 my-1 align-self-center"
         th:insert="header.html :: header"></div>
</div>


<div class="row mx-auto fill-height">
    <div class="col-sm-5 col-md-4 col-lg-3 col-xl-2 p-0 pr-2 bg-light container-fluid"
         th:insert="filter_selection.html :: filterSelection"></div>
    <div class="col-sm p-0 container-fluid"
         id="dashboard"
         th:insert="table_view.html :: tableView"></div>
</div>
<script th:inline="javascript">
    // setting contextpath
    window.CONTEXTPATH = /*[[@{/}]]*/ "/";
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    function enterPseudonym(event) {
        event.preventDefault();
        let input = $('#pseudonymInitInput').val();
        $.ajax({
            type: 'GET',
            url: window.CONTEXTPATH + 'assistance/' + input,
            dataType: 'text',
            success: function (responseData) {
                location.href = window.CONTEXTPATH + '?lang=' + responseData;
            }
        });

        sessionStorage.setItem('visited', '1');
    }
    /*]]>*/

</script>
</body>
</html>
<style>
    html, body {
        height: 100%;
    }
    .fill-height {
        height: 100%;
    }
</style>
