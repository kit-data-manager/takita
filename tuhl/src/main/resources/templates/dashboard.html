<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>dashboard</title>
</head>
<body>
<div th:fragment="dashboard" class="container-fluid">
  <div class="row justify-content-center mt-3">
    <h1 class="col-form-label" th:text="#{prompt.choose_view}"> </h1>
  </div>
  <div class="form-row justify-content-center">
    <button class="btn btn-secondary col-auto mx-1"
            th:each="key : ${availableViews.keySet()}"
            th:text="${availableViews.get(key)}"
            th:data-view="${key}"
            onclick="choose(this.getAttribute('data-view'))"> </button>
  </div>
  <script th:inline="javascript">
      // setting contextpath
      window.CONTEXTPATH = /*[[@{/}]]*/ "/";
  </script>
  <script>
      function choose(contentView) {
          $('#dashboard').load(window.CONTEXTPATH + 'dashboard/contentview/' + contentView)
      }
      window.onload = function() {
          $('#dashboard').load(window.CONTEXTPATH + 'dashboard/contentview')
      }
  </script>
</div>
</body>
</html>
