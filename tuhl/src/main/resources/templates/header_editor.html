<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Header Editor</title>
</head>
<body>
<div th:fragment="header_editor">

    <table class="table table-borderless">
        <thead class="table-light align-middle">
            <th width="10%"></th>
            <th width="20%"><i class="bx bx-home" onclick="goHome();"></i></th>
            <th width="20%" th:text="${currentManuscript.title}"></th>
            <th width="10%"></th>
            <th width="20%"></th>
            <th class="text-end" width="20%" style="position: relative;">
                <div class="row" style="gap: 5px; width:100%;">
                    <div class="pseudonym-wrapper" th:insert="~{pseudonym.html :: pseudonym}" style="flex: 1 1 30px; padding: 0;"></div>
                    <button class="btn btn-info" th:text="#{buttons.help}" onclick="getHelp()" style="width:36px"> </button>
                    <a href="mailto:gitlab-incomingsfb1475-inf-takita-9732-issue-@ruhr-uni-bochum.de"
                    rel="noopener noreferrer" target="_blank" class="issueLink btn" style="width:36px;position: relative;">
                        <svg fill-rule="evenodd" clip-rule="evenodd" stroke-linejoin="round"
                        stroke-miterlimit="1.414" xmlns="http://www.w3.org/2000/svg"
                        aria-labelledby="title" viewBox="0 0 32 32"
                        preserveAspectRatio="xMidYMid meet" class="issueSvg">
                            <title id="title">feedback</title>
                            <g>
                                <path
                                    d="m16.913 2.4326a1.9968 1.9968 0 0 0-1.877 0l-11.981 6.3897a1.9968 1.9968 0 0 0-1.0583 1.7612v1.6314l6.4596 3.8738a5.5111 5.5111 0 0 0-0.46525 2.0507l-5.9944-3.5942v11.448l6.9468-4.1673c0.29952 0.54912 0.66893 1.1042 1.1142 1.6573l-7.9912 4.7963a1.9968 1.9968 0 0 0 1.9269 1.4736h23.962a1.9968 1.9968 0 0 0 1.9269-1.4736l-7.9912-4.7943c0.44528-0.55511 0.81469-1.1102 1.1142-1.6593l6.9468 4.1673v-11.45l-5.9944 3.5962a5.5111 5.5111 0 0 0-0.46525-2.0487l6.4596-3.8758v-1.6314a1.9968 1.9968 0 0 0-1.0583-1.7612zm-2.8155-1.7632a3.9936 3.9936 0 0 1 3.758 0l11.981 6.3897a3.9936 3.9936 0 0 1 2.1126 3.5243v17.172a3.9936 3.9936 0 0 1-3.9936 3.9936h-23.962a3.9936 3.9936 0 0 1-3.9936-3.9936v-17.172a3.9936 3.9936 0 0 1 2.1146-3.5243l11.981-6.3897zm1.877 15.092c3.3227-3.4165 11.631 2.5619 0 10.248-11.631-7.6877-3.3227-13.664 0-10.248z"
                                    stroke-width="1.9968" fill-rule="evenodd"/>
                            </g>
                        </svg>
                    </a>
                </div>
            </th>
        </thead>
        <tbody>
            <tr>
                <td width="10%"></td>
                <td width="20%" th:text="#{col_name.noPages}"></td>
                <td width="20%" th:text="${currentManuscript.noPages}"></td>
                <td width="10%"></td>
                <td width="20%" th:text="#{col_name.created}"></td>
                <td width="20%" th:text="${currentManuscript.created}"></td>
            </tr>
            <tr>
                <td></td>
                <td th:text="#{col_name.pageNumber}"></td>
                <td th:text="${currentPage.pageNumber}"></td>
                <td></td>
                <td th:text="#{col_name.lastModified}"></td>
                <td th:text="${currentManuscript.lastModified}"></td>
            </tr>
        </tbody>
      </table>

    <script th:inline="javascript">
        // setting contextpath
        window.CONTEXTPATH = /*[[@{/}]]*/ "/";
        
        function getHelp(){
            location.href = window.CONTEXTPATH + 'assistance/help';
        }
        // returning to table view of repository data
        function goHome() {
            location.href = window.CONTEXTPATH;
        };        
    </script>
</div>
</body>
</html>
