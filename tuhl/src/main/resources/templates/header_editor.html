<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Header Editor</title>
</head>
<body>
<div th:fragment="header_editor">

    <table class="table table-borderless">
        <thead class="table-light align-middle">
            <th width="10%"></th>
            <th width="20%"><i class="bx bx-home" onclick="goHome();"></i></th>
            <th width="20%" th:text="${currentManuscript.title}"></th>
            <th width="10%"></th>
            <th width="20%"></th>
            <th class="text-end" width="20%">
                <div class="row">
                    <div class="col-9" th:insert="pseudonym.html :: pseudonym"></div>
                    <button class="col-auto btn btn-info" th:text="#{buttons.help}" onclick="getHelp()"> </button>
                </div>
            </th>
        </thead>
        <tbody>
            <tr>
                <td width="10%"></td>
                <td width="20%" th:text="#{col_name.noPages}"></td>
                <td width="20%" th:text="${currentManuscript.noPages}"></td>
                <td width="10%"></td>
                <td width="20%" th:text="#{col_name.created}"></td>
                <td width="20%" th:text="${currentManuscript.created}"></td>
            </tr>
            <tr>
                <td></td>
                <td th:text="#{col_name.pageNumber}"></td>
                <td th:text="${currentPage.pageNumber}"></td>
                <td></td>
                <td th:text="#{col_name.lastModified}"></td>
                <td th:text="${currentManuscript.lastModified}"></td>
            </tr>
        </tbody>
      </table>

    <script th:inline="javascript">
        function getHelp(){
            location.href = '/assistance/help';
        }
    </script>
</div>
</body>
</html>
