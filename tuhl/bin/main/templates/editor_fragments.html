<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editor</title>
</head>

<body>
    <div class="col" th:fragment="annotationViewer">
        <div th:if="${currentAnnotation == null}">
          <label th:text="#{prompt.nothing_here}"> </label>
        </div>
        <div th:if="${currentAnnotation != null}">
          <h5 th:text="#{label.anno}"> </h5>
          <table class="table">
            <tbody>
            <tr>
              <td th:text="#{att_name.pageId}"> </td>
              <td th:text="${currentAnnotation.pageId}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.id}"> </td>
              <td th:text="${currentAnnotation.id}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.modified}"> </td>
              <td th:text="${currentAnnotation.modified}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.creators}"> </td>
              <td th:text="${currentAnnotation.creators}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.created}"> </td>
              <td th:text="${currentAnnotation.created}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.via}"> </td>
              <td th:text="${currentAnnotation.via}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.canonical}"> </td>
              <td th:text="${currentAnnotation.canonical}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.color}"> </td>
              <td th:text="${currentAnnotation.color.getName()}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.svgCode}"> </td>
              <td th:text="${currentAnnotation.svgCode}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.motivation}"> </td>
              <td th:text="${currentAnnotation.motivation}"> </td>
            </tr>
            <tr>
              <td th:text="#{att_name.tags}"> </td>
              <td th:text="${currentAnnotation.tags}"> </td>
            </tr>
            </tbody>
          </table>
    
          <div class="accordion" id="cards">
            <div class="card" th:each="body, i : ${currentAnnotation.textCards}">
              <div class="card-header"
                   type="button"
                   data-toggle="collapse"
                   th:data-target="${'#card'+ i.index}">
                <label th:text="${body.id}"> </label>
              </div>
              <div class="collapse"
                   th:id="${'card' + i.index}">
                <div class="card-body"
                     th:include="editor_stub_fragments :: bodyViewer(${body})">
                </div>
              </div>
            </div>
          </div>
    
          <div class="accordion" id="tags">
            <div class="card" th:each="body, i : ${currentAnnotation.tags}">
              <div class="card-header"
                   type="button"
                   data-toggle="collapse"
                   th:data-target="${'#tag'+ i.index}">
                <label th:text="${body.id}"> </label>
              </div>
              <div class="collapse"
                   th:id="${'tag' + i.index}">
                <div class="card-body"
                     th:include="editor_stub_fragments :: bodyViewer(${body})">
                </div>
              </div>
            </div>
          </div>
    
        </div>
      </div>
</body>
