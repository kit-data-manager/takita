<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Help</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous" th:href="@{https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css}">

    <!-- JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2" crossorigin="anonymous" th:src="@{https://code.jquery.com/jquery-3.5.1.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous" th:src="@{https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js}"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous" th:src="@{https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js}"></script>
</head>
<body>
<div class="row p-3 bg-light justify-content-between">
    <div class="col-auto">
        <button class="btn btn-primary" onclick="backToMain()" th:text="#{buttons.home}">
        </button>
    </div>
    <div class="dropdown col-auto">
        <button class="btn btn-info dropdown-toggle" type="button"  data-toggle="dropdown"
                aria-haspopup="true" aria-expanded="false" th:text="#{buttons.language}">
        </button>
        <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <a class="dropdown-item" href="?lang=de" th:text="#{language.de}"> </a>
            <a class="dropdown-item" href="?lang=en" th:text="#{language.gb}"> </a>
        </div>
    </div>
</div>

<div class="row justify-content-center mt-3">
    <div class="col-auto">
        <h3 class="text-center display-3" th:text="#{heading.help}"> </h3>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingPseudonym}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpPseudonym}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingLanguage}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpLanguage}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingColumns}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpColumns}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingSorting}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpSorting}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingRows}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpRows}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class=card-text display-5 th:text="#{text.headingPages}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpPages}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingSearch}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpSearch}">
                </p>
            </div>
        </div>

        <div class="card m-4">
            <div class="card-body">
                <h5 class="card-title display-5" th:text="#{text.headingFilters}"> </h5>
                <p class="card-text font-weight-light" size="3"
                   th:text="#{text.helpFilters}">
                </p>
            </div>
        </div>
    </div>
</div>

    <script>
        function backToMain() {
            location.href = "/";
        }
    </script>
</body>
</html>
