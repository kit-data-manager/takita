<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{label.editor}"> </title>
    <!-- Bootstrap core JavaScript -->
    <!-- CSS only -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous"
          th:href="@{https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css}">

    <!-- JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"
            th:src="@{https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js}"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
            integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"
            th:src="@{https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
    <script src="/js/editor.js"></script>
    <script src="/js/editor_svg.js"></script>
    
</head>
<body class="container-fluid p-0" th:data-field="${currentAnnotationsJson}" 
    onload="init(document.body.getAttribute('data-field'))" 
    onresize="resizeViewbox()">
<div id="editor" th:fragment="editor">
    <div class="row mx-auto pr-3 bg-light">
        <div class="col-auto align-self-center">
            <button class="btn btn-primary" onclick="goHome()" th:text="#{buttons.back}"> </button>
        </div>
        <!-- table for metadata -->
        <div class="col-auto">
            <div class="row">
                <div class="col-auto">
                    <table class="table">
                        <tbody>
                        <tr>
                            <td th:text="#{col_name.id}"> </td>
                            <td th:text="${currentManuscript.id}"> </td>
                        </tr>
                        <tr>
                            <td th:text="#{col_name.title}"> </td>
                            <td th:text="${currentManuscript.title}"> </td>
                        </tr>
                        <tr>
                            <td th:text="#{col_name.publisher}"> </td>
                            <td th:text="${currentManuscript.publisher}"> </td>
                        </tr>
                        <tr>
                            <td th:text="#{col_name.publicationYear}"> </td>
                            <td th:text="${currentManuscript.publicationYear}"> </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="col-auto">
                    <table class="table">
                        <tbody>
                        <tr>
                            <td th:text="#{col_name.created}"> </td>
                            <td th:text="${currentManuscript.created}"> </td>
                        </tr>
                        <tr>
                            <td th:text="#{col_name.lastModified}"> </td>
                            <td th:text="${currentManuscript.lastModified}"> </td>
                        </tr>
                        <tr>
                            <td th:text="#{col_name.noPages}"> </td>
                            <td th:text="${currentManuscript.noPages}"> </td>
                        </tr>
                        <tr>
                            <td th:text="#{col_name.hasAlgoAnnos}"> </td>
                            <td th:text="${currentManuscript.hasAlgorithmAnnotations()}"> </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-4 p-6 my-1 align-self-center"
             th:insert="header.html :: header"></div>
    </div>

    <!-- manuscript page -->
    <div class="row mx-auto">
        <div class="col-7 p-0 container-fluid px-5 pt-3">
            <div class="row scrollable mx-5">
                <div id="imageWorkspace">
                    <img th:if="${currentPage.resourceType == (T(edu.kit.scc.dem.tuhl.model.page.ResourceType).IMAGE)}"
                        th:src="${currentPage.getResourceUrl()}" class="img-fluid unselectable" id="pageImage">
                    <label class="text-center"
                        th:if="${currentPage.resourceType != (T(edu.kit.scc.dem.tuhl.model.page.ResourceType).IMAGE)}"
                        th:text="#{info.no_text_support}">
                    </label>
                </div>
                <button id="editAnnoSvg" onclick="toggleEditable()" type="button" class="btn btn-primary">edit</button>
            </div>
        </div>
        
        <!-- bodies and annotations -->
        <div class="col-5 p-0 container-fluid scrollable px-5 pt-3" style="height: 100vh">
            <div class="row mx-auto" id="viewerHolder">
            </div>
        </div>
    </div>
    <div class="row m-5">
        <div class="col-auto">
            <div >
                <button class="btn btn-primary"
                    type="button"
                    data-toggle="collapse"
                    data-target="#outline"
                    aria-expanded="false"
                    aria-controls="outline"
                    th:text="#{buttons.annotations}">
                </button>
             </div>
        <div class="col-auto">
            <button class="btn btn-primary"
                    type="button"
                    data-toggle="collapse"
                    data-target="#pages"
                    aria-expanded="false"
                    aria-controls="pages"
                    th:text="#{buttons.pages}">
            </button>
        </div>
        <div class="collapse col-auto" id="outline">
            <div class="card card-body">
                <table class="table">
                    <tbody>
                    <tr th:each="anno : ${currentPage.getAnnotations()}">
                        <td th:text="${anno.getId()}"
                            th:title="${anno.getId()}"
                            th:data-field="${anno.getSvgCode()}"
                            th:bgcolor="${anno.getColor().getColorHex()}"
                            id="anno_id"
                            onclick="selectAnnotation(event, this.getAttribute('title'));
                                    drawSvg(this.getAttribute('data-field'), this.getAttribute('bgcolor'))">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="collapse col-auto" id="pages">
            <div class="card card-body no-wrap">
                <div class="row">
                    <div class="mx-1 col-auto" th:each="page : ${currentManuscript.pages}">
                        <div class="row">
                            <div class="col">
                                <img th:src="${page.thumbResourceUrl}"
                                     class="img-thumbnail"
                                     id="pageThumb"
                                     th:if="${page.id != currentPage.id}"
                                     th:data-field="${page.id}"
                                     onclick="page(event)">
                                <img th:src="${page.thumbResourceUrl}"
                                     class="img-thumbnail bg-primary"
                                     th:if="${page.id == currentPage.id}">
                            </div>
                        </div>
                        <div class="row">
                            <label class="col-auto text-center" th:text="${page.pageNumber}">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
<style>
.scrollable {
    overflow-y: scroll;
}

.no-wrap > .row {
    overflow-x: auto;
    white-space: nowrap;
    flex-wrap: nowrap;
}
.no-wrap > .row > .col-auto{
    display: inline-block;
    float: none;
}

.show-yourself {
    border: 5px solid red;
}

#imageWorkspace {
    background-color: yellowgreen; /* debug color, is hidden behind image if everything works as intended */
    position: relative;
    display: inline-block; /* shrinks container to image size */
}

#imageWorkspace img {
    display: block;
    max-width: 100%;
    height: auto;
}

#imageWorkspace svg {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%; /* use containers size */
    width: 100%;
}

/*
   Optional. Prevent the accidential selection of the image (or other elements).
   Old, but still works at least in Firefox, might be better to find a new method for this.
   Very old source: https://stackoverflow.com/questions/5915023/preventing-images-and-text-to-be-selected
*/
.unselectable {
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -o-user-select: none;
    user-select: none;
}
</style>
