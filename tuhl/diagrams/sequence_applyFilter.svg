e style="stroke: #A80036; stroke-width: 1.4; stroke-dasharray: 2.0,2.0;" x1="66.5" x2="228.9" y1="484.9359" y2="484.9359"/><text fill="#000000" font-family="sans-serif" font-size="18.2" lengthAdjust="spacingAndGlyphs" textLength="110.6" x="83.3" y="478.1369">http response</text><!--MD5=[c0e48e71425a2e8d7277b173134bc4ac]
@startuml
participant Browser as b
participant "Dispatcher\nServlet" as ds

b -> ds: http post request
activate ds

ds -> ":FilterController" as fc: applyFilters(filterSelection, model)
activate fc

fc -> ":IFilterService" as fs: setCurrentFilters(filters)
activate fs

fs - -> fc
deactivate fs

fc -> ":ISearchService" as ss: search(pageNumber)
activate ss

ss -> fs: getFilters()
activate fs

fs - -> ss: currentFilters
deactivate fs

ss - -> fc: searchResults for pageNumber
deactivate ss

fc - -> ds: html-file name
deactivate fc

ds - -> b: http response
deactivate ds
@enduml

