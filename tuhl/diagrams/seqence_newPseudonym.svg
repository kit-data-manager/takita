ly="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="28" x="691.5" y="369.2949">User</text><polygon fill="#A80036" points="441.5,406.3477,431.5,410.3477,441.5,414.3477,437.5,410.3477" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="435.5" x2="668.5" y1="410.3477" y2="410.3477"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="28" x="447.5" y="405.6055">User</text><polygon fill="#A80036" points="193.5,435.6582,183.5,439.6582,193.5,443.6582,189.5,439.6582" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="187.5" x2="424.5" y1="439.6582" y2="439.6582"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="95" x="199.5" y="434.916">html-file name</text><polygon fill="#A80036" points="55.5,464.9688,45.5,468.9688,55.5,472.9688,51.5,468.9688" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="49.5" x2="176.5" y1="468.9688" y2="468.9688"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="87" x="61.5" y="464.2266">http response</text><!--MD5=[fc2467e0772260238b59f80c6f2e9943]
@startuml
participant Browser as b
participant "Dispatcher\nServlet" as ds

b -> ds: http post request
activate ds

ds -> ":AssistanceController" as ac : setPseudonym(pseudonym, model)
activate ac

ac -> ":IAssistanceService" as as : getUserByPseudonym(pseudonym)
activate as

as -> ":UserRepository" as ur : findOne(pseudonym)
activate ur

alt user is new
ur - -> as : null


as -> ":User" as u : User(pseudonym)
activate u

u - -> as : User
deactivate u

as -> ur: save(User)
activate ur

ur - -> as
deactivate ur

else user already exists


ur - -> as: User
deactivate ur
end
as - -> ac : User
deactivate as

ac - -> ds: html-file name
deactivate ac

ds - -> b : http response
deactivate ds

@enduml

