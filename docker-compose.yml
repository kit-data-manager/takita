version: '2.2'
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.8.1
    container_name: es
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms8g -Xmx8g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200